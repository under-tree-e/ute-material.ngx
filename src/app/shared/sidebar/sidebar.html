<div class="docs-component-viewer-nav">
    <div class="docs-component-viewer-nav-content">
        <mat-nav-list>
            @for(page of pageManager.getItems(true); track page){
            <a mat-list-item [routerLink]="'/' + page.id" routerLinkActive="docs-component-viewer-sidenav-item-selected" (click)="toggleSidenav.emit()"> {{page.name}} </a>
            }
            <h3>Components</h3>
            <!-- <div class="diviner"></div> -->
            @for(component of pageManager.getItems(); track component){
            <a mat-list-item [routerLink]="'/components/' + component.id" routerLinkActive="docs-component-viewer-sidenav-item-selected" (click)="toggleSidenav.emit()"> {{component.name}} </a>
            }
        </mat-nav-list>
    </div>
</div>
